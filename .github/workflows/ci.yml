name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: economic_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: economic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U economic_ci -d economic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate migrations
        run: npm run migrate:validate

      - name: Apply migrations to disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://economic_ci:disposable-ci-only@localhost:5432/economic_ci
        run: npm run migrate

      - name: Configure isolated economic database roles
        env:
          DATABASE_URL: postgresql://economic_ci:disposable-ci-only@localhost:5432/economic_ci
        run: npm run db:economic:roles

      - name: PostgreSQL persistence and reliability tests
        env:
          TEST_DATABASE_URL: postgresql://economic_ci:disposable-ci-only@localhost:5432/economic_ci
        run: npm run test:postgres
